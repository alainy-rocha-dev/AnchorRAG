[project]
name = "anchor-rag"
version = "0.1.0"
description = "AnchorRAG - High-Precision RAG Engine with Strict Citation, Multi-Provider Support & SQLite-Vec"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "AnchorRAG Team", email = "dev@anchor-rag.local"}
]
keywords = ["rag", "embedding", "vector-search", "llm", "pdf", "sqlite-vec", "anchor-rag"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pdfplumber>=0.11.0",
    "pypdf>=5.0.0",
    "tiktoken>=0.7.0",
    "numpy>=1.26.0",
    "sqlite-vec>=0.1.6",
    "httpx>=0.27.0",
    "typer>=0.12.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "pyyaml>=6.0.1",
    "tenacity>=8.0.0",
]
[project.optional-dependencies]
openai = ["openai>=1.35.0"]
ollama = []
huggingface = ["sentence-transformers>=3.0.0", "torch>=2.3.0"]
anthropic = ["anthropic>=0.30.0"]
dev = ["pytest>=8.2.0", "ruff>=0.5.0", "mypy>=1.10.0", "pytest-asyncio>=0.23.0", "pytest-cov>=5.0.0", "scipy>=1.13.0"]

[project.scripts]
anchor-rag = "anchor_rag.cli:app"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "I", "UP", "W"]
ignore = ["E501"]
extend-ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
strict = true
exclude = ["tests/fixtures/"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["anchor_rag*"]