# Dataset de Avaliação BACEN - AnchorRAG
# Versão: 1.0
# Fonte: Normas do Banco Central do Brasil (Resoluções CMN, Circulares BACEN, Comunicados, Resoluções BCB)
# Formato: Lista de casos de teste para avaliação de recall@k, MRR, taxa de alucinação, cobertura de citações

eval_cases:
  - id: "bacen_001"
    question: "Qual o limite de exposição de crédito para uma única contraparte segundo a Resolução CMN 4.557?"
    expected_chunks: ["chunk_cmn4557_art12", "chunk_cmn4557_art13"]
    expected_answer_contains: "25% do Patrimônio de Referência"
    metadata:
      source: "Resolução CMN 4.557"
      topic: "Limite de exposição de crédito"
      difficulty: "fácil"

  - id: "bacen_002"
    question: "Quais são os requisitos de capital mínimo para instituições de pagamento segundo a Circular BACEN 3.978?"
    expected_chunks: ["chunk_cb3978_art5", "chunk_cb3978_art6"]
    expected_answer_contains: "Patrimônio Líquido mínimo de R$ 2 milhões"
    metadata:
      source: "Circular BACEN 3.978"
      topic: "Capital mínimo instituições de pagamento"
      difficulty: "médio"

  - id: "bacen_003"
    question: "Como a Resolução CMN 4.893 trata a classificação de risco de crédito para operações de microcrédito?"
    expected_chunks: ["chunk_cmn4893_art8", "chunk_cmn4893_art9"]
    expected_answer_contains: "classificação de risco simplificada"
    metadata:
      source: "Resolução CMN 4.893"
      topic: "Classificação de risco microcrédito"
      difficulty: "médio"

  - id: "bacen_004"
