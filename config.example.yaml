# Configuração de exemplo para AnchorRAG
# Copie para config.yaml e ajuste conforme necessário

embedding:
  provider: "openai"  # openai, ollama, huggingface
  model: "text-embedding-3-small"
  dimensions: 1536
  batch_size: 100
  api_key_env: "OPENAI_API_KEY"
  base_url: null
  # Para ollama:
  # provider: "ollama"
  # model: "nomic-embed-text"
  # dimensions: 768
  # base_url: "http://localhost:11434"
  # Para huggingface:
  # provider: "huggingface"
  # model: "sentence-transformers/all-MiniLM-L6-v2"
  # dimensions: 384

llm:
  provider: "openai"  # openai, ollama, anthropic
  model: "gpt-4o-mini"
  temperature: 0.1
  max_tokens: 2048
  timeout: 30
  api_key_env: "OPENAI_API_KEY"
  base_url: null
  # Para ollama:
  # provider: "ollama"
  # model: "llama3.1:8b"
  # base_url: "http://localhost:11434"
  # Para anthropic:
  # provider: "anthropic"
  # model: "claude-3-haiku-20240307"
  # api_key_env: "ANTHROPIC_API_KEY"

chunking:
  chunk_size: 512
  chunk_overlap: 50
  chunk_unit: "tokens"  # chars ou tokens
  min_chunk_size: 50
  parser: "pdfplumber"  # pdfplumber ou pypdf
  structured: false  # true = chunking por artigo/inciso/parágrafo (normas jurídicas)

vector_store:
  type: "sqlite_vec"  # sqlite_vec (único suportado por enquanto)
  path: "./data/anchor_rag.db"
  embedding_dimensions: 1536  # Deve corresponder ao embedding.dimensions

retrieval:
  mode: "hybrid"  # vector, hybrid, fts_only
  reranker_provider: null  # huggingface, ollama, cohere
  reranker_model: "BAAI/bge-reranker-v2-m3"  # bge-reranker-v2-m3, bge-reranker-base
  reranker_batch_size: 32

logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  format: "json"  # json ou text
  output: "stdout"  # stdout, stderr, ou caminho do arquivo
  include_request_id: true

query_log:
  enabled: false
  path: "./data/query_log.db"